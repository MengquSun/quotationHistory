services:
  - type: web
    name: quotationhist-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: quotationhist-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    envVars:
      - key: APP_ENV
        value: production
      - key: BACKEND_URL
        value: https://quotationhist-backend.onrender.com
